        <!DOCTYPE html>
        <html lang="en">
        <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Admin Dashboard</title>

            <link rel="stylesheet" href="../css/adashboard.css">

            <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
        </head>

        <body>

            <!-- SIDEBAR -->
            <aside class="sidebar">

                <div class="logo-area">
                    <img src="../images/PTC LOGO.png" alt="PTC Logo">
                    <h2>PTC Admin</h2>
                </div>

                <button onclick="loadTeachers()">
                    Manage Teachers
                </button>

                <button onclick="loadStudents()">
                    Manage Students
                </button>

                <!-- ADD TEACHER BUTTON -->
                <button onclick="loadAddTeacher()">
                    Add Teacher
                </button>

                <button onclick="loadReports()">
                    Attendance Reports
                </button>

                <button class="logout-btn" onclick="logout()">
                    Logout
                </button>

            </aside>

            <!-- MAIN -->
            <div class="main">

                <!-- TOPBAR -->
                <header class="topbar">
                    <h1>Admin Dashboard</h1>
                </header>

                <!-- CONTENT -->
                <section id="mainContent"></section>

            </div>

        <script>

            let studentData = [];
            let editingStudentId = null;

            function loadStudents() {

    fetch(`${API}/admin/students`)
    .then(res => res.json())
    .then(data => {

        studentData = data;

        let html = `
            <div class="card">

                <h2>Manage Students</h2>

                <button onclick="loadAddStudent()">
                    + Add Student
                </button>

                <input 
                    type="text"
                    class="search-box"
                    placeholder="Search student..."
                    onkeyup="filterStudents()"
                    id="studentSearch"
                >

                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Student ID</th>
                            <th>Name</th>
                            <th>Section</th>
                            <th>Email</th>
                            <th>Actions</th>
                        </tr>
                    </thead>

                    <tbody id="studentTableBody">
                        ${renderStudentRows(data)}
                    </tbody>
                </table>

            </div>
        `;

        document.getElementById("mainContent").innerHTML = html;
    })
    .catch(err => {
        console.error("LOAD STUDENTS ERROR:", err);
        alert("Failed to load students");
    });
}

function loadAddStudent() {

    editingStudentId = null;

    document.getElementById("mainContent").innerHTML = `
        <div class="card">

            <h2>Add Student</h2>

            <input id="student_id" placeholder="Student ID">

            <input id="full_name" placeholder="Full Name">

            <select id="gender">
                <option value="">Select Gender</option>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
            </select>

            <input id="section" placeholder="Section">

            <input id="parent_email" placeholder="Parent Email">

            <input id="student_email" placeholder="Student Email">

            <button onclick="saveStudent()">
                Save Student
            </button>

        </div>
    `;
}

function saveStudent() {

    const student_id = document.getElementById("student_id").value;
    const full_name = document.getElementById("full_name").value;
    const gender = document.getElementById("gender").value;
    const section = document.getElementById("section").value;
    const parent_email = document.getElementById("parent_email").value;
    const student_email = document.getElementById("student_email").value;

    if (!student_id || !full_name || !gender || !section || !parent_email || !student_email) {
        alert("Please fill all fields");
        return;
    }

    const url = editingStudentId
        ? `${API}/admin/students/${editingStudentId}`
        : `${API}/admin/students`;

    const method = editingStudentId ? "PUT" : "POST";

    fetch(url, {
        method,
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
            student_id,
            full_name,
            gender,
            section,
            parent_email,
            student_email
        })
    })
    .then(res => res.json())
    .then(data => {
        alert(data.message || "Success");
        loadStudents();
    })
    .catch(err => {
        console.error(err);
        alert("Error saving student");
    });
}

function editStudent(id) {

    const student = studentData.find(s => s.id === id);
    editingStudentId = id;

    document.getElementById("mainContent").innerHTML = `
        <div class="card">

            <h2>Edit Student</h2>

            <input id="student_id" value="${student.student_id}">
            <input id="full_name" value="${student.full_name}">

            <select id="gender">
                <option value="Male" ${student.gender === "Male" ? "selected" : ""}>Male</option>
                <option value="Female" ${student.gender === "Female" ? "selected" : ""}>Female</option>
            </select>

            <input id="section" value="${student.section}">
            <input id="parent_email" value="${student.parent_email}">
            <input id="student_email" value="${student.student_email}">

            <button onclick="saveStudent()">Update Student</button>

        </div>
    `;
}

function deleteStudent(id) {

    if (!confirm("Delete this student?")) return;

    fetch(`${API}/admin/students/${id}`, {
        method: "DELETE"
    })
    .then(res => res.json())
    .then(data => {
        alert(data.message || "Deleted");
        loadStudents();
    })
    .catch(err => console.error(err));
}

function filterStudents() {

    const value = document
        .getElementById("studentSearch")
        .value
        .toLowerCase();

    const filtered = studentData.filter(s =>
        (s.student_id || "").toLowerCase().includes(value) ||
        (s.full_name || "").toLowerCase().includes(value) ||
        (s.section || "").toLowerCase().includes(value) ||
        (s.student_email || "").toLowerCase().includes(value)
    );

    document.getElementById("studentTableBody")
        .innerHTML = renderStudentRows(filtered);
}

function renderStudentRows(data) {

    if (!data || data.length === 0) {
        return `<tr><td colspan="5">No students found</td></tr>`;
    }

    return data.map(s => `
        <tr>
            <td>${s.student_id}</td>
            <td>${s.full_name}</td>
            <td>${s.section}</td>
            <td>${s.student_email}</td>
            <td>
                <button onclick="editStudent(${s.id})">Edit</button>
                <button onclick="deleteStudent(${s.id})">Delete</button>
            </td>
        </tr>
    `).join("");
}

        const API = "http://localhost:3000";

        // ======================================
        // LOAD ADD TEACHER PAGE
        // ======================================
        function loadAddTeacher() {

            let html = `

                <div class="card">

                    <h2>Add Teacher</h2>

                    <input 
                        type="text" 
                        id="name" 
                        placeholder="Enter Teacher Name"
                    >

                    <input 
                        type="email" 
                        id="email" 
                        placeholder="Enter Teacher Email"
                    >

                    <div class="password-wrapper">

    <input 
        type="password" 
        id="password" 
        placeholder="Enter Password"
    >

    <span class="toggle-password" onclick="toggleTeacherPassword()">
        👁
    </span>

</div>
                    <button class="save-btn" onclick="addTeacher()">
                        Save Teacher
                    </button>

                </div>
            `;

            document.getElementById("mainContent").innerHTML = html;
        }

        // ======================================
        // LOAD TEACHERS
        // ======================================
        let teacherData = [];

        function loadTeachers() {

            fetch(`${API}/admin/teachers`)
            .then(res => res.json())
            .then(data => {

                teacherData = data;

                let html = `
                    <div class="card">
                        <h2>Manage Teachers</h2>

                        <input 
                            type="text" 
                            id="teacherSearch" 
                            class="search-box"
                            placeholder="Search teacher..."
                            onkeyup="filterTeachers()"
                        >

                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>Name</th>
                                    <th>Email</th>
                                </tr>
                            </thead>

                            <tbody id="teacherTableBody">
                                ${renderTeacherRows(data)}
                            </tbody>
                        </table>
                    </div>
                `;

                document.getElementById("mainContent").innerHTML = html;
            });
        }

        // ======================================
        // ADD TEACHER
        // ======================================
        function addTeacher() {

            const name = document.getElementById("name").value;
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;

            if (!name || !email || !password) {
                alert("Please fill in all fields");
                return;
            }

            fetch(`${API}/admin/teacher`, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ name, email, password })
            })
            .then(res => res.text())
            .then(msg => {
                alert(msg);

                // AFTER ADDING, GO TO MANAGE TEACHERS
                loadTeachers();
            })
            .catch(err => {
                console.error(err);
                alert("Failed to add teacher");
            });
        }

        function renderTeachers(data, html = "") {

            let rows = "";

            if (data.length === 0) {
                rows = `
                    <tr>
                        <td colspan="2">No teachers found</td>
                    </tr>
                `;
            } else {
                data.forEach(t => {
                    rows += `
                        <tr>
                            <td>${t.name}</td>
                            <td>${t.email}</td>
                        </tr>
                    `;
                });
            }

            const table = html + rows + `
                    </tbody>
                </table>
            </div>
            `;

            document.getElementById("mainContent").innerHTML = table;
        }

        function renderTeacherRows(data) {

            if (!data || data.length === 0) {
                return `<tr><td colspan="2">No teachers found</td></tr>`;
            }

            return data.map(t => `
                <tr>
                    <td>${t.name}</td>
                    <td>${t.email}</td>
                </tr>
            `).join("");
        }

        function filterTeachers() {

            const value = document.getElementById("teacherSearch").value.toLowerCase();

            const filtered = teacherData.filter(t =>
                t.name.toLowerCase().includes(value) ||
                t.email.toLowerCase().includes(value)
            );

            document.getElementById("teacherTableBody").innerHTML = renderTeacherRows(filtered);
        }

        // ======================================
        // LOAD REPORTS
        // ======================================
        let reportData = [];

        function loadReports() {

            fetch(`${API}/attendance/reports`)
            .then(res => res.json())
            .then(data => {

                reportData = data;

                let html = `
                    <div class="card">
                        <h2>Attendance Reports</h2>

                        <input 
                            type="text" 
                            id="reportSearch" 
                            class="search-box"
                            placeholder="Search name, section, status..."
                            onkeyup="filterReports()"
                        >

                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>Student ID</th>
                                    <th>Name</th>
                                    <th>Section</th>
                                    <th>Status</th>
                                    <th>Date</th>
                                    <th>Time</th>
                                </tr>
                            </thead>

                            <tbody id="reportTableBody">
                                ${renderReportRows(data)}
                            </tbody>
                        </table>
                    </div>
                `;

                document.getElementById("mainContent").innerHTML = html;
            });
        }
        function renderReports(data, html = "") {

            let rows = "";

            if (data.length === 0) {
                rows = `
                    <tr>
                        <td colspan="6">No reports found</td>
                    </tr>
                `;
            } else {
                data.forEach(r => {
                    rows += `
                        <tr>
                            <td>${r.student_id}</td>
                            <td>${r.full_name}</td>
                            <td>${r.section}</td>
                            <td>${r.status}</td>
                            <td>${r.date}</td>
                            <td>${r.time}</td>
                        </tr>
                    `;
                });
            }

            const table = html + rows + `
                    </tbody>
                </table>
            </div>
            `;

            document.getElementById("mainContent").innerHTML = table;
        }

        function filterReports() {

    const value = document.getElementById("reportSearch").value.toLowerCase();

    const filtered = reportData.filter(r => {

        return (
            String(r.student_id || "").toLowerCase().includes(value) ||
            String(r.full_name || "").toLowerCase().includes(value) ||
            String(r.section || "").toLowerCase().includes(value) ||
            String(r.status || "").toLowerCase().includes(value) ||
            String(r.date || "").toLowerCase().includes(value)
        );

    });

    document.getElementById("reportTableBody").innerHTML =
        renderReportRows(filtered);
}

        function renderReportRows(data) {

    if (!data || data.length === 0) {
        return `<tr><td colspan="6">No reports found</td></tr>`;
    }

    return data.map(r => `
        <tr>
            <td>${r.student_id ?? ""}</td>
            <td>${r.full_name ?? ""}</td>
            <td>${r.section ?? ""}</td>
            <td>${r.status ?? ""}</td>
            <td>${r.date ?? ""}</td>
            <td>${r.time ?? ""}</td>
        </tr>
    `).join("");
}   

function toggleTeacherPassword() {
    const password = document.getElementById("password");
    const icon = document.querySelector(".toggle-password");

    if (password.type === "password") {
        password.type = "text";
        icon.textContent = "👁";
    } else {
        password.type = "password";
        icon.textContent = "👁";
    }
}

        // ======================================
        // LOGOUT
        // ======================================
        function logout() {
            localStorage.clear();
            alert("Logged out successfully");
            window.location.href = "index.html";
        }

        // AUTO LOAD
        loadTeachers();

        </script>

        </body>
        </html>
