<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>

    <link rel="stylesheet" href="../css/adashboard.css">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

    <!-- SIDEBAR -->
    <aside class="sidebar">

        <div class="logo-area">
            <img src="../images/PTC LOGO.png" alt="PTC Logo">
            <h2>PTC Admin</h2>
        </div>

        <!-- ADD TEACHER BUTTON -->
        <button onclick="loadAddTeacher()">
            Add Teacher
        </button>

        <button onclick="loadTeachers()">
            Manage Teachers
        </button>

        <button onclick="loadReports()">
            Attendance Reports
        </button>

        <button class="logout-btn" onclick="logout()">
            Logout
        </button>

    </aside>

    <!-- MAIN -->
    <div class="main">

        <!-- TOPBAR -->
        <header class="topbar">
            <h1>Admin Dashboard</h1>
        </header>

        <!-- CONTENT -->
        <section id="mainContent"></section>

    </div>

<script>

const API = "http://localhost:3000";

// ======================================
// LOAD ADD TEACHER PAGE
// ======================================
function loadAddTeacher() {

    let html = `

        <div class="card">

            <h2>Add Teacher</h2>

            <input 
                type="text" 
                id="name" 
                placeholder="Enter Teacher Name"
            >

            <input 
                type="email" 
                id="email" 
                placeholder="Enter Teacher Email"
            >

            <input 
                type="password" 
                id="password" 
                placeholder="Enter Password"
            >

            <button class="save-btn" onclick="addTeacher()">
                Save Teacher
            </button>

        </div>
    `;

    document.getElementById("mainContent").innerHTML = html;
}

// ======================================
// LOAD TEACHERS
// ======================================
function loadTeachers() {

    fetch(`${API}/admin/teachers`)
    .then(res => res.json())
    .then(data => {

        let html = `

            <!-- MANAGE TEACHERS -->
            <div class="card">

                <h2>Manage Teachers</h2>

                <div class="teacher-grid">
        `;

        if (data.length === 0) {
            html += `<p>No teachers found.</p>`;
        }

        data.forEach(teacher => {

            html += `
                <div class="teacher-card">

                    <p><strong>Name:</strong> ${teacher.name}</p>
                    <p><strong>Email:</strong> ${teacher.email}</p>

                </div>
            `;
        });

        html += `
                </div>
            </div>
        `;

        document.getElementById("mainContent").innerHTML = html;
    })
    .catch(err => {
        console.error(err);
        alert("Failed to load teachers");
    });
}

// ======================================
// ADD TEACHER
// ======================================
function addTeacher() {

    const name = document.getElementById("name").value;
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    if (!name || !email || !password) {
        alert("Please fill in all fields");
        return;
    }

    fetch(`${API}/admin/teacher`, {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({ name, email, password })
    })
    .then(res => res.text())
    .then(msg => {
        alert(msg);

        // AFTER ADDING, GO TO MANAGE TEACHERS
        loadTeachers();
    })
    .catch(err => {
        console.error(err);
        alert("Failed to add teacher");
    });
}

// ======================================
// LOAD REPORTS
// ======================================
function loadReports() {

    fetch(`${API}/attendance/reports`)
    .then(res => res.json())
    .then(data => {

        let html = `

            <div class="card">

                <h2>Attendance Reports</h2>

                <div class="report-grid">
        `;

        if (data.length === 0) {
            html += `<p>No attendance reports found.</p>`;
        }

        data.forEach(report => {

            html += `
                <div class="report-card">

                    <p><strong>Student ID:</strong> ${report.student_id}</p>
                    <p><strong>Name:</strong> ${report.full_name}</p>
                    <p><strong>Section:</strong> ${report.section}</p>
                    <p><strong>Status:</strong> ${report.status}</p>
                    <p><strong>Date:</strong> ${report.date}</p>
                    <p><strong>Time:</strong> ${report.time}</p>

                </div>
            `;
        });

        html += `
                </div>
            </div>
        `;

        document.getElementById("mainContent").innerHTML = html;
    })
    .catch(err => {
        console.error(err);
        alert("Failed to load reports");
    });
}

// ======================================
// LOGOUT
// ======================================
function logout() {
    localStorage.clear();
    alert("Logged out successfully");
    window.location.href = "index.html";
}

// AUTO LOAD
loadTeachers();

</script>

</body>
</html>
