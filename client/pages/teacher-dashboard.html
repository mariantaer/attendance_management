<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Dashboard</title>

    <link rel="stylesheet" href="../css/tdashboard.css">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

</head>

<!-- ATTENDANCE MODAL -->
<div id="attendanceModal">
    <div class="modal-box">

        <h2>Mark Attendance</h2>

        <h3 id="modalStudentName"></h3>

        <select id="modalStatus">
            <option value="Present">Present</option>
            <option value="Absent">Absent</option>
            <option value="Late">Late</option>
        </select>

        <div class="modal-buttons">

            <button class="btn-save" onclick="saveSingleAttendance()">
                Save
            </button>

            <button class="btn-cancel" onclick="closeModal()">
                Cancel
            </button>

        </div>

    </div>
</div>

<!-- LOGOUT MODAL -->
<div id="logoutModal" class="modal-overlay">

    <div class="modal-content">

        <h2 id="logoutTitle">
            Logout
        </h2>

        <p id="logoutMessage">
            Are you sure you want to logout?
        </p>

        <div class="modal-actions">

            <button class="back-btn"
                onclick="closeLogoutModal()">
                Cancel
            </button>

            <button class="delete-btn"
                onclick="logout()">
                Logout
            </button>

        </div>

    </div>

</div>

<body>

    <!-- SIDEBAR -->
    <aside class="sidebar">

        <div class="logo-area">
            <img src="../images/PTC LOGO.png" alt="Logo">
            <h2>PTC AMS</h2>
        </div>

        <button onclick="loadStudents()">
            Students
        </button>

        <button onclick="showAttendance()">
            Attendance
        </button>

        <button onclick="viewReports()">
            Reports
        </button>

        <button class="logout-btn" onclick="showLogoutModal()">
            Logout
        </button>

        </aside>

    <!-- MAIN -->
    <div class="main">

        <!-- TOPBAR -->
        <header class="topbar">
            <h1>Teacher Dashboard</h1>
        </header>

        <!-- CONTENT -->
        <main id="mainContent"></main>

    </div>

<script>

    function to12Hour(time24) {
    if (!time24) return "";

    let [hours, minutes] = time24.split(":");
    hours = parseInt(hours);

    const period = hours >= 12 ? "PM" : "AM";
    hours = hours % 12 || 12;

    return `${hours}:${minutes} ${period}`;
}

    let selectedStudentId = null;
    let selectedStudentName = "";

    const API = "http://localhost:3000";

    // ================= FIXED POPUP =================
    function openAttendancePopup(student){

        selectedStudentId = student.student_id; // ✅ FIXED (was student.id)
        selectedStudentName = student.full_name;

        document.getElementById("modalStudentName").innerText =
            student.full_name;

        document.getElementById("attendanceModal").style.display = "flex";
    }

    function closeModal(){
        document.getElementById("attendanceModal").style.display = "none";
    }

    function saveSingleAttendance(){

    const status = document.getElementById("modalStatus").value;

    const now = new Date();

    const hours = String(now.getHours()).padStart(2, "0");
    const minutes = String(now.getMinutes()).padStart(2, "0");

    const timeString = `${hours}:${minutes}`;

    fetch(`${API}/attendance/mark`, {
        method:"POST",
        headers:{
            "Content-Type":"application/json"
        },
        body: JSON.stringify({
            student_id: selectedStudentId,
            status: status,
            time: timeString
        })
    })
    .then(res => res.text())
    .then(msg => {
        alert(msg);
        closeModal();
    });
}

    // ======================================
    function groupBySection(data){

        const grouped = {};

        data.sort((a, b) => {

            const genderCompare =
            (a.gender || "")
            .localeCompare(b.gender || "");

            if(genderCompare !== 0){
                return genderCompare;
            }

            return (a.full_name || "")
            .localeCompare(b.full_name || "");
        });

        data.forEach(item => {

            if(!grouped[item.section]){
                grouped[item.section] = [];
            }

            grouped[item.section].push(item);
        });

        return grouped;
    }

    // ======================================
    function createSectionDropdown(
        sections,
        selectedValue,
        functionName,
        selectedDate = ""
    ){

        let html = `
            <div class="section-filter">
                <label>Select Section:</label>
                <select onchange="${functionName}(this.value, '${selectedDate}')">
                    <option value="">All Sections</option>
        `;

        sections.forEach(section => {

            html += `
                <option value="${section}" ${selectedValue === section ? "selected" : ""}>
                    ${section}
                </option>
            `;
        });

        html += `</select></div>`;
        return html;
    }

    // ======================================
    function loadStudents(selectedSection = ""){

        fetch(`${API}/teacher/students`)
        .then(res => res.json())
        .then(data => {

            const grouped = groupBySection(data);
            const sections = Object.keys(grouped);

            let html = `<div class="card"><h2>Students List</h2>`;

            html += createSectionDropdown(sections, selectedSection, "loadStudents");

            for(const section in grouped){

                if(selectedSection && section !== selectedSection) continue;

                html += `<h3>Section: ${section}</h3><table><thead><tr>
                    <th>Student_ID</th>
                    <th>Name</th>
                    <th>Gender</th>
                    <th>Email</th>
                    <th>Parent</th>
                </tr></thead><tbody>`;

                grouped[section].forEach(student => {

                    html += `
                        <tr>
                            <td>${student.student_id}</td>
                            <td>${student.full_name}</td>
                            <td>${student.gender}</td>
                            <td>${student.student_email}</td>
                            <td>${student.parent_email}</td>
                        </tr>
                    `;
                });

                html += `</tbody></table><br>`;
            }

            html += `</div>`;
            document.getElementById("mainContent").innerHTML = html;
        });
    }

    // ======================================
    function showAttendance(selectedSection = ""){

        fetch(`${API}/teacher/students`)
        .then(res => res.json())
        .then(data => {

            const grouped = groupBySection(data);
            const sections = Object.keys(grouped);

            let html = `<div class="card"><h2>Mark Attendance</h2>`;

            html += createSectionDropdown(sections, selectedSection, "showAttendance");

            for(const section in grouped){

                if(selectedSection && section !== selectedSection) continue;

                html += `<h3>Section: ${section}</h3><table><thead><tr>
                    <th>Student_ID</th>
                    <th>Name</th>
                    <th>Gender</th>
                    <th>Time In</th>
                    <th>Status</th>
                </tr></thead><tbody>`;

                grouped[section].forEach(student => {

                    html += `
                        <tr>
                            <td>
                                ${student.student_id}

                            <td style="cursor:pointer;color:#166534;font-weight:bold"
                                onclick='openAttendancePopup(${JSON.stringify(student)})'>
                                ${student.full_name}
                            </td>
                            <td>${student.gender}</td>

                            <td>
                                <input type="time" id="time-${student.id}" style="padding:5px">
                            </td>

                            <td>
                                <select id="status-${student.id}">
                                    <option value="Present">Present</option>
                                    <option value="Absent">Absent</option>
                                    <option value="Late">Late</option>
                                </select>
                            </td>
                        </tr>
                    `;
                });

                html += `</tbody></table><br>`;
            }

            html += `
                <div class="save-wrapper">
                    <button class="btn-save-attendance" onclick="saveAttendance()">
                        Save Attendance
                    </button>
                </div>
            </div>`;

            document.getElementById("mainContent").innerHTML = html;
        });
    }

    // ======================================
    function saveAttendance() {
    const rows = document.querySelectorAll("select[id^='status-']");
    const requests = [];

    rows.forEach(select => {
        const studentId = select.id.replace("status-", "");
        const status = select.value;

        const timeInput = document.getElementById(`time-${studentId}`);
        const time24 = timeInput ? timeInput.value : "";

        const time12 = to12Hour(time24);

        requests.push(
            fetch(`${API}/attendance/mark`, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    student_id: studentId,
                    status: status,
                    time:
                        time24 ||
                        new Date().toLocaleTimeString([], {
                            hour: "2-digit",
                            minute: "2-digit",
                            hour12: false
                        })

                })
            })
        );
    });

    Promise.all(requests)
        .then(() => {
            alert("Attendance saved successfully!");
        })
        .catch(error => {
            console.error("Error saving attendance:", error);
            alert("Failed to save attendance.");
        });
}


    // ======================================
    // ✅ YOUR REPORTS FUNCTION (UNCHANGED)
    // ======================================
    function viewReports(selectedSection = "", selectedDate = "") {

    fetch(`${API}/attendance/reports`)
        .then(res => res.json())
        .then(data => {

            // filter section
            if (selectedSection) {
                data = data.filter(
                    item => item.section === selectedSection
                );
            }

            // filter date
            if (selectedDate) {
                data = data.filter(item => {

                    const dbDate =
                        new Date(item.date)
                        .toISOString()
                        .split("T")[0];

                    return dbDate === selectedDate;
                });
            }

            // newest first
            data.sort((a, b) =>
                new Date(b.date + " " + (b.time || "00:00")) -
                new Date(a.date + " " + (a.time || "00:00"))
            );

            // group by section
            const grouped = {};

            data.forEach(item => {

                const section = item.section || "No Section";

                if (!grouped[section]) {
                    grouped[section] = [];
                }

                grouped[section].push(item);
            });

            const sections = [
                ...new Set(
                    data.map(item => item.section)
                )
            ];

            let html = `
                <div class="card">
                    <h2>Attendance Reports</h2>

                    <div class="filters">

                        <div class="section-filter">
                            <label>Section:</label>

                            <select
                                onchange="viewReports(this.value, '${selectedDate}')">

                                <option value="">All Sections</option>

                                ${sections.map(sec => `
                                    <option value="${sec}"
                                        ${sec === selectedSection ? "selected" : ""}>
                                        ${sec}
                                    </option>
                                `).join("")}

                            </select>
                        </div>

                        <div class="date-filter">
                            <label>Date:</label>

                            <input
                                type="date"
                                value="${selectedDate}"
                                onchange="viewReports('${selectedSection}', this.value)">
                        </div>

                    </div>
            `;

            for (const section in grouped) {

                html += `
                    <h3>Section: ${section}</h3>

                    <table>
                        <thead>
                            <tr>
                                <th>Student ID</th>
                                <th>Student Name</th>
                                <th>Gender</th>
                                <th>Status</th>
                                <th>Date</th>
                                <th>Time</th>
                            </tr>
                        </thead>

                        <tbody>
                `;

                grouped[section].forEach(report => {

                    html += `
                        <tr>
                            <td>${report.student_id}</td>
                            <td>${report.full_name}</td>
                            <td>${report.gender}</td>
                            <td>${report.status}</td>
                            <td>${formatDateMMDDYYYY(report.date)}</td>
                            <td>${formatTime12Hour(report.time)}</td>
                        </tr>
                    `;
                });

                html += `
                        </tbody>
                    </table>
                    <br>
                `;
            }

            if (data.length === 0) {
                html += `<p>No attendance records found.</p>`;
            }

            html += `</div>`;

            document.getElementById("mainContent").innerHTML = html;
        })
        .catch(err => {
            console.error(err);

            alert("Failed to load reports.");
        });
}

    // ======================================
    function logout(){
        localStorage.clear();
        window.location.href = "index.html";
    }

    function showLogoutModal() {

    document.getElementById("logoutModal").style.display =
        "flex";
}

function closeLogoutModal() {

    document.getElementById("logoutModal").style.display =
        "none";
}

    loadStudents();

    function formatDateMMDDYYYY(dateStr) {
        const d = new Date(dateStr);
        const mm = String(d.getMonth() + 1).padStart(2, "0");
        const dd = String(d.getDate()).padStart(2, "0");
        const yyyy = d.getFullYear();

        return `${mm}/${dd}/${yyyy}`;
    }

    function formatTime12Hour(timeStr) {

    if (!timeStr) return "";

    // already contains AM/PM
    if (/AM|PM/i.test(timeStr)) {
        return timeStr.trim();
    }

    const [hourStr, min] = timeStr.split(":");

    let hour = parseInt(hourStr, 10);

    const period = hour >= 12 ? "PM" : "AM";

    hour = hour % 12 || 12;

    return `${hour}:${min} ${period}`;
}

</script>

</body>
</html>
