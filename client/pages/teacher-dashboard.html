<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Dashboard</title>

    <link rel="stylesheet" href="../css/tdashboard.css">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

</head>

<!-- ATTENDANCE MODAL -->
<div id="attendanceModal">
    <div class="modal-box">

        <h2>Mark Attendance</h2>

        <h3 id="modalStudentName"></h3>

        <select id="modalStatus">
            <option value="Present">Present</option>
            <option value="Absent">Absent</option>
            <option value="Late">Late</option>
        </select>

        <div class="modal-buttons">

            <button class="btn-save" onclick="saveSingleAttendance()">
                Save
            </button>

            <button class="btn-cancel" onclick="closeModal()">
                Cancel
            </button>

        </div>

    </div>
</div>

<body>

    <!-- SIDEBAR -->
    <aside class="sidebar">

        <div class="logo-area">
            <img src="../images/PTC LOGO.png" alt="Logo">
            <h2>PTC AMS</h2>
        </div>

        <button onclick="loadStudents()">
            Students
        </button>

        <button onclick="showAttendance()">
            Attendance
        </button>

        <button onclick="viewReports()">
            Reports
        </button>

        <button class="logout-btn" onclick="logout()">
            Logout
        </button>

    </aside>

    <!-- MAIN -->
    <div class="main">

        <!-- TOPBAR -->
        <header class="topbar">
            <h1>Teacher Dashboard</h1>
        </header>

        <!-- CONTENT -->
        <main id="mainContent"></main>

    </div>

<script>

    let selectedStudentId = null;
    let selectedStudentName = "";

    const API = "http://localhost:3000";

    // ================= FIXED POPUP =================
    function openAttendancePopup(student){

        selectedStudentId = student.id; // ✅ FIXED (was student.student_id)
        selectedStudentName = student.full_name;

        document.getElementById("modalStudentName").innerText =
            student.full_name;

        document.getElementById("attendanceModal").style.display = "flex";
    }

    function closeModal(){
        document.getElementById("attendanceModal").style.display = "none";
    }

    function saveSingleAttendance(){

        const status = document.getElementById("modalStatus").value;

        fetch(`${API}/attendance/mark`, {
            method:"POST",
            headers:{
                "Content-Type":"application/json"
            },
            body:JSON.stringify({
                student_id: selectedStudentId,
                status: status
            })
        })
        .then(res => res.text())
        .then(() => {
            alert(`${selectedStudentName} marked ${status}`);
            closeModal();
        });
    }

    // ======================================
    function groupBySection(data){

        const grouped = {};

        data.sort((a, b) => {

            const genderCompare =
            (a.gender || "")
            .localeCompare(b.gender || "");

            if(genderCompare !== 0){
                return genderCompare;
            }

            return (a.full_name || "")
            .localeCompare(b.full_name || "");
        });

        data.forEach(item => {

            if(!grouped[item.section]){
                grouped[item.section] = [];
            }

            grouped[item.section].push(item);
        });

        return grouped;
    }

    // ======================================
    function createSectionDropdown(
        sections,
        selectedValue,
        functionName,
        selectedDate = ""
    ){

        let html = `
            <div class="section-filter">
                <label>Select Section:</label>
                <select onchange="${functionName}(this.value, '${selectedDate}')">
                    <option value="">All Sections</option>
        `;

        sections.forEach(section => {

            html += `
                <option value="${section}" ${selectedValue === section ? "selected" : ""}>
                    ${section}
                </option>
            `;
        });

        html += `</select></div>`;
        return html;
    }

    // ======================================
    function loadStudents(selectedSection = ""){

        fetch(`${API}/teacher/students`)
        .then(res => res.json())
        .then(data => {

            const grouped = groupBySection(data);
            const sections = Object.keys(grouped);

            let html = `<div class="card"><h2>Students List</h2>`;

            html += createSectionDropdown(sections, selectedSection, "loadStudents");

            for(const section in grouped){

                if(selectedSection && section !== selectedSection) continue;

                html += `<h3>Section: ${section}</h3><table><thead><tr>
                    <th>ID</th><th>Name</th><th>Gender</th><th>Email</th><th>Parent</th>
                </tr></thead><tbody>`;

                grouped[section].forEach(student => {

                    html += `
                        <tr>
                            <td>${student.id}</td>
                            <td>${student.full_name}</td>
                            <td>${student.gender}</td>
                            <td>${student.student_email}</td>
                            <td>${student.parent_email}</td>
                        </tr>
                    `;
                });

                html += `</tbody></table><br>`;
            }

            html += `</div>`;
            document.getElementById("mainContent").innerHTML = html;
        });
    }

    // ======================================
    function showAttendance(selectedSection = ""){

        fetch(`${API}/teacher/students`)
        .then(res => res.json())
        .then(data => {

            const grouped = groupBySection(data);
            const sections = Object.keys(grouped);

            let html = `<div class="card"><h2>Mark Attendance</h2>`;

            html += createSectionDropdown(sections, selectedSection, "showAttendance");

            for(const section in grouped){

                if(selectedSection && section !== selectedSection) continue;

                html += `<h3>Section: ${section}</h3><table><thead><tr>
                    <th>Name</th><th>Gender</th><th>Status</th>
                </tr></thead><tbody>`;

                grouped[section].forEach(student => {

                    html += `
                        <tr>
                            <td style="cursor:pointer;color:#166534;font-weight:bold"
                                onclick='openAttendancePopup(${JSON.stringify(student)})'>
                                ${student.full_name}
                            </td>

                            <td>${student.gender}</td>

                            <td>
                                <select id="status-${student.id}">
                                    <option value="Present">Present</option>
                                    <option value="Absent">Absent</option>
                                    <option value="Late">Late</option>
                                </select>
                            </td>
                        </tr>
                    `;
                });

                html += `</tbody></table><br>`;
            }

            html += `
                <div class="save-wrapper">
                    <button class="btn-save-attendance" onclick="saveAttendance()">
                        Save Attendance
                    </button>
                </div>
            </div>`;

            document.getElementById("mainContent").innerHTML = html;
        });
    }

    // ======================================
    function saveAttendance(){

    const rows = document.querySelectorAll("select[id^='status-']");

    const requests = [];

    rows.forEach(select => {

        const studentId = select.id.replace("status-", "");
        const status = select.value;

        requests.push(
            fetch(`${API}/attendance/mark`, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    student_id: studentId,
                    status: status
                })
            })
        );
    });

    Promise.all(requests)
    .then(() => {
        alert("Attendance saved successfully!");
    })
    .catch(err => {
        console.error(err);
        alert("Error saving attendance");
    });
}

    // ======================================
    // ✅ YOUR REPORTS FUNCTION (UNCHANGED)
    // ======================================
    function viewReports(selectedSection = "", selectedDate = "") {

    let url = `${API}/attendance/reports`;

    if (selectedDate) {
        url += `?date=${selectedDate}`;
    }

    fetch(url)
    .then(res => res.json())
    .then(data => {

        // GROUP BY SECTION (no sorting now)
        const grouped = {};

        data.forEach(item => {
            if (!grouped[item.section]) {
                grouped[item.section] = [];
            }
            grouped[item.section].push(item);
        });

        const sections = Object.keys(grouped);

        let html = `<div class="card"><h2>Attendance Reports</h2>`;

        // FILTER UI (section + date only)
        html += `
            <div class="filters">

                <div class="section-filter">
                    <label>Section:</label>
                    <select onchange="viewReports(this.value, '${selectedDate}')">
                        <option value="">All Sections</option>
                        ${sections.map(sec => `
                            <option value="${sec}" ${sec === selectedSection ? "selected" : ""}>
                                ${sec}
                            </option>
                        `).join("")}
                    </select>
                </div>

                <div class="date-filter">
                    <label>Date:</label>
                    <input type="date"
                        value="${selectedDate}"
                        onchange="viewReports('${selectedSection}', this.value)">
                </div>

            </div>
        `;

        // TABLES
        for (const section in grouped) {

            if (selectedSection && section !== selectedSection) continue;

            html += `
                <h3>Section: ${section}</h3>
                <table>
                    <thead>
                        <tr>
                            <th>Student Name</th>
                            <th>Gender</th>
                            <th>Status</th>
                            <th>Date</th>
                            <th>Time</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            grouped[section].forEach(report => {

                html += `
                    <tr>
                        <td>${report.full_name}</td>
                        <td>${report.gender}</td>
                        <td>${report.status}</td>
                        <td>${report.date}</td>
                        <td>${report.time}</td>
                    </tr>
                `;
            });

            html += `</tbody></table><br>`;
        }

        html += `</div>`;

        document.getElementById("mainContent").innerHTML = html;
    });
}

    // ======================================
    function logout(){
        localStorage.clear();
        window.location.href = "index.html";
    }

    loadStudents();

</script>

</body>
</html>
